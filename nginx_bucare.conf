# ── Redirect www → non-www (canonical) ──
server {
    listen 443 ssl;
    server_name www.bucaresuite.com;

    ssl_certificate /etc/letsencrypt/live/bucaresuite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bucaresuite.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bucaresuite.com$request_uri;
}

# ── Main server block ──
server {
    server_name bucaresuite.com bucaredemo.ddns.net 35.254.151.234;
    client_max_body_size 25M;

    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # ── Uploaded user assets (backend port 5000) ──
    # ^~ modifier prevents regex location rules (like .webp / .png below) from overriding this
    location ^~ /uploads/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── API routes (backend port 5000) ──
    location ^~ /api/v1/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Frontend static asset caching (frontend port 3000) ──
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot|css|js)$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Frontend SSR fallback (frontend port 3000) ──
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bucaresuite.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bucaresuite.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name bucaresuite.com www.bucaresuite.com bucaredemo.ddns.net 35.254.151.234;
    return 301 https://bucaresuite.com$request_uri;
}
